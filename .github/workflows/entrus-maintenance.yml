name: EnTrus preventive maintenance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: entrus-maintenance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  maintenance:
    name: maintenance-source-checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: tools/entrus_pm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Maintenance engine regression
        run: python -B -m unittest discover -s tests -v
      - name: Changed-file maintenance guard
        run: python -B ci.py

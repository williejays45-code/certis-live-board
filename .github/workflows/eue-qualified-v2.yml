name: Qualified interpretation v2 boundary
on:
  push:
    branches:
      - feature/eue-interpretation-v2-20261020
  workflow_dispatch:
permissions:
  contents: read
jobs:
  new-consumer-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Only the new synthetic v2 compatibility boundary
        run: node --test --test-reporter=tap backend/eue-qualified-interpretations.test.mjs
